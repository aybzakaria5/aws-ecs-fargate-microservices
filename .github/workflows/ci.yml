name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, orders, notifications]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Dependency audit (production dependencies, informational)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  image:
    name: Docker build and smoke test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [auth, orders, notifications]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ${{ matrix.service }}:ci services/${{ matrix.service }}
      - name: Start the container the way ECS runs it (non-root user, read-only filesystem) and call /health
        run: |
          docker run -d --name svc --read-only -p 3000:3000 -e JWT_SECRET=ci-only-secret ${{ matrix.service }}:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; exit 0; fi
            sleep 1
          done
          echo "service did not become healthy"; docker logs svc; exit 1
      - name: Show container logs
        if: always()
        run: docker logs svc || true

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format check (non-blocking, fix with `terraform fmt -recursive`)
        run: terraform fmt -check -diff -recursive
        continue-on-error: true
      - run: terraform init -backend=false -input=false
      - run: terraform validate
