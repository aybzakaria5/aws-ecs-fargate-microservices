version: 2
# Monthly and grouped, so the repository does not fill up with pull requests.
# Major version jumps (a new Node release, AWS provider 6.x ...) are ignored on purpose: they need a manual,
# tested upgrade rather than an automatic pull request.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directories: [/services/auth, /services/orders, /services/notifications]
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      npm-dependencies: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/services/auth, /services/orders, /services/notifications]
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directory: /infra
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
