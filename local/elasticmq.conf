# ElasticMQ = a small SQS-compatible server used only for local development (docker compose).
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  order-events-dlq {}
  order-events {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "order-events-dlq"
      maxReceiveCount = 5
    }
  }
}
